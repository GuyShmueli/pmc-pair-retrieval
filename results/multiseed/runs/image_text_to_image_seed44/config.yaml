configuration: image_text_to_image
seed: 44
hash_seed: 42
split: data/article_disjoint_split.json
hard_negatives: data/hard_negatives.json
image_size: 224
train_views: 3
eval_views: 3
crop_scale:
- 0.9
- 1.0
epochs: 30
batch_size: 128
lr: 1.0e-06
weight_decay: 0.2
betas:
- 0.9
- 0.98
eps: 1.0e-06
warmup_steps: 200
clip_grad_norm: 1.5
frozen_vision_blocks: 8
precision: bf16
grad_checkpointing: all
lambda_image_image: 0.3
lambda_image_text: 0.6
triplet_margin: 0.09
triplet_topk_negatives: 4
hard_negatives_per_anchor: 15
hard_negatives_sampled_per_image: 3
query_text: mean
eval_batch_size: 128
text_batch_size: 256
early_stopping:
  metric: R@10
  min_epochs: 3
  patience: 3
num_workers: 4
log_every: 20
