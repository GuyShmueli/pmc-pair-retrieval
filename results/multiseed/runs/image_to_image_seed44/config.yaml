configuration: image_to_image
seed: 44
hash_seed: 42
split: data/article_disjoint_split.json
pixel_hashes: data/pixel_md5.json
image_size: 224
train_views: 3
eval_views: 3
crop_scale:
- 0.9
- 1.0
color_jitter:
  brightness: 0.1
  contrast: 0.1
  p: 0.5
rotation_degrees: 5
epochs: 12
batch_size: 128
lr: 6.0e-06
layer_decay: 0.75
weight_decay: 0.05
betas:
- 0.9
- 0.98
eps: 1.0e-06
warmup_steps: 200
clip_grad_norm: 1.5
temperature: 0.1
grad_checkpointing: true
eval_batch_size: 128
early_stopping:
  metric: R@10
  min_epochs: 3
  patience: 12
num_workers: 8
log_every: 100
